name: Lean L2/L3 proofs

on:
  push:
    branches: [master, feature/formal-proofs]
    paths:
      - 'proof/lean/**'
      - '.github/workflows/lean-proofs.yml'
  pull_request:
    branches: [master, feature/formal-proofs]
    paths:
      - 'proof/lean/**'
      - '.github/workflows/lean-proofs.yml'
  workflow_dispatch:

# 显式 shell: bash → GitHub 以 `bash -eo pipefail` 运行；
# 否则 `lake build ... | tee | tail` 在 lake build 失败时 step 仍会通过
defaults:
  run:
    shell: bash

jobs:
  lake-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Read Lean toolchain
        id: toolchain
        run: |
          cd proof/lean
          ver=$(cat lean-toolchain | sed 's|^leanprover/lean4:||')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Lean toolchain: $ver"

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Lean toolchain
        run: |
          cd proof/lean
          elan toolchain install "${{ steps.toolchain.outputs.version }}"
          elan override set "${{ steps.toolchain.outputs.version }}"

      - name: Cache Mathlib build artifacts
        uses: actions/cache@v4
        with:
          path: proof/lean/.lake
          key: lake-${{ steps.toolchain.outputs.version }}-${{ hashFiles('proof/lean/lake-manifest.json') }}
          restore-keys: |
            lake-${{ steps.toolchain.outputs.version }}-

      - name: Lake get dependencies
        run: |
          cd proof/lean
          lake exe cache get || true

      - name: Lake build (all CLPoly proofs) + sorry 检查
        run: |
          cd proof/lean
          lake build 2>&1 | tee /tmp/lake-build.log | tail -50
          # 检查真 sorry warning（lake 对 sorry 使用会发 "declaration uses 'sorry'" warning）
          # 排除 Experiment/ 下的已知 sorry
          if grep "warning:.*uses 'sorry'" /tmp/lake-build.log | grep -v "/Experiment/" ; then
            echo "ERROR: found sorry warning outside Experiment/"
            exit 1
          else
            echo "OK: no sorry warning outside Experiment/"
          fi

      - name: 公理审计（同时编译默认目标之外的 van Hoeij 完全正确性证明）
        run: |
          cd proof/lean
          # 三个审计文件不在默认 lake build 目标的导入闭包里；构建它们会顺带编译
          # VanHoeijRetryTotal 等 70 个原本 CI 不编译的模块
          audits=(
            CLPoly/Refinement/FinalAxiomAudit.lean
            CLPoly/Refinement/VanHoeijRetryAudit.lean
            CLPoly/Refinement/VanHoeijSeparationAudit.lean
          )
          mods=()
          for f in "${audits[@]}"; do m=${f%.lean}; mods+=("${m//\//.}"); done
          lake build "${mods[@]}" 2>&1 | tail -20
          for f in "${audits[@]}"; do
            out="/tmp/$(basename "$f" .lean).out"
            if ! lake env lean "$f" > "$out" 2>&1; then
              cat "$out"
              exit 1
            fi
            python3 scripts/check_axiom_audit.py "$f" "$out"
          done

      - name: Lake build B2B targets
        run: |
          cd proof/lean
          lake build B2B.Registry B2B.Driver 2>&1 | tail -10
